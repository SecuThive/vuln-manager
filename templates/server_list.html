<!DOCTYPE html>
<html><head><title>Dashboard</title><style>body{font-family:sans-serif;padding:30px;background:#f0f2f5;max-width:1000px;margin:0 auto}.card{background:white;padding:25px;border-radius:10px;box-shadow:0 4px 6px rgba(0,0,0,0.1)}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}th{background:#fafafa}tr:hover{background:#f9f9f9;cursor:pointer}.btn{padding:8px 16px;border:none;border-radius:5px;color:white;cursor:pointer;text-decoration:none}.btn-primary{background:#4CAF50}.btn-logout{background:#666;margin-right:5px}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5)}.modal-content{background:white;margin:10% auto;padding:20px;width:300px;border-radius:8px}</style></head>
<body><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">🖥️ Dashboard</h2><div><span style="margin-right:15px">👤 {{user}}</span><a href="/logout" class="btn btn-logout">로그아웃</a><button class="btn btn-primary" onclick="document.getElementById('m').style.display='block'">+ 추가</button></div></div>
<table><thead><tr><th>IP</th><th>User</th><th>Date</th><th>Action</th></tr></thead><tbody>{% for ip, srv in servers.items() %}<tr onclick="location.href='/server/{{srv.ip}}'"><td><b>{{srv.ip}}</b></td><td>{{srv.username}}</td><td>{{srv.created_at}}</td><td><a href="/server/{{srv.ip}}" style="color:#2196F3">상세보기</a></td></tr>{% endfor %}</tbody></table></div>
<div id="m" class="modal"><div class="modal-content"><h3>서버 등록</h3><form id="f"><input name="ip" placeholder="IP" required style="width:100%;margin:5px 0;padding:8px"><input name="username" placeholder="User" required style="width:100%;margin:5px 0;padding:8px"><input type="password" name="password" placeholder="PW" required style="width:100%;margin:5px 0;padding:8px"><button class="btn btn-primary" style="width:100%;margin-top:10px">등록</button><button type="button" onclick="location.reload()" style="width:100%;margin-top:5px;background:#ccc;border:none;padding:8px;border-radius:5px">닫기</button></form></div></div>
<script>document.getElementById('f').onsubmit=async function(e){e.preventDefault();alert("연결 중...");let res=await fetch('/add',{method:'POST',body:new FormData(this)});let j=await res.json();alert(j.msg);if(j.success)location.reload()}</script></body></html>
